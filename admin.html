<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#CDD5E9" />
  <title>장소 관리 · Avery&Rose in Seoul</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    /* 색·모서리는 styles.css(DESIGN.md)와 같은 값 */
    :root {
      --bg: #cdd5e9; --bg-soft: #dce2f0; --surface: #fff; --surface-soft: #f1f3f8;
      --text: #101114; --text-2: #4b5060; --muted: #7a7f8c; --line: rgba(16, 17, 20, 0.12);
      --accent: #f9d98a; --dark: #111214; --danger: #c8473a;
      --eat: #f28b7d; --see: #6fa3e6; --walk: #5fb582;
      --r-card: 30px; --r-inner: 18px; --r-pill: 999px;
      --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.55; letter-spacing: -0.01em; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    h1, h2, h3, p { margin: 0; }
    button, input, select, textarea { font: inherit; color: inherit; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 120px; }

    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 4px 20px; }
    header h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.035em; }
    header a { font-size: 14px; color: var(--text-2); }

    .card { background: var(--surface); border-radius: var(--r-card); padding: 20px; margin-bottom: 14px; }
    .card h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
    .muted { color: var(--muted); font-size: 14px; }
    ol.steps { margin: 10px 0 14px; padding-left: 20px; font-size: 14px; color: var(--text-2); }
    ol.steps li { margin-bottom: 4px; }

    .btn { border: 0; border-radius: var(--r-pill); padding: 11px 18px; min-height: 44px; background: var(--surface-soft); cursor: pointer; font-weight: 500; }
    .btn.primary { background: var(--dark); color: #fff; }
    .btn.accent { background: var(--accent); }
    .btn.danger { color: var(--danger); }
    .btn.small { padding: 6px 12px; min-height: 36px; font-size: 14px; }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 14px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; border: 0; border-radius: var(--r-pill); padding: 9px 14px; background: var(--bg-soft); cursor: pointer; font-size: 14px; white-space: nowrap; }
    .chip.on { background: var(--dark); color: #fff; }

    .place { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--line); }
    .place:first-of-type { border-top: 0; }
    .thumb { flex: none; width: 64px; height: 64px; border-radius: 16px; background: var(--surface-soft) center / cover no-repeat; display: grid; place-items: center; font-size: 24px; }
    .place .body { flex: 1; min-width: 0; }
    .place .name { font-weight: 600; }
    .place .note { font-size: 14px; color: var(--text-2); }
    .place .warn { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .place .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .kind { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); margin-right: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-eat { background: var(--eat); } .dot-see { background: var(--see); } .dot-walk { background: var(--walk); }

    .field { display: block; margin-bottom: 14px; }
    label.field > span, .field > .label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    label.field > small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
    input[type=text], input[type=password], input[type=url], select, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px; background: #fff; font-size: 16px;
    }
    textarea { min-height: 72px; resize: vertical; }
    .seg { display: flex; gap: 6px; }
    .seg label { flex: 1; }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg span { display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--r-pill); padding: 10px; background: var(--surface-soft); cursor: pointer; font-size: 14px; }
    .seg input:checked + span { background: var(--dark); color: #fff; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 420px) { .pair { grid-template-columns: 1fr; } }
    .photo-preview { width: 100%; aspect-ratio: 4 / 3; border-radius: var(--r-inner); background: var(--surface-soft) center / cover no-repeat; display: grid; place-items: center; color: var(--muted); margin-bottom: 8px; }

    .tabs { display: flex; gap: 6px; background: var(--bg-soft); border-radius: var(--r-pill); padding: 4px; margin-bottom: 14px; }
    .tabs button { flex: 1; border: 0; border-radius: var(--r-pill); padding: 10px; background: transparent; cursor: pointer; font-size: 14px; font-weight: 500; }
    .tabs button.on { background: var(--dark); color: #fff; }
    .phrase { padding: 14px 0; border-top: 1px solid var(--line); }
    .phrase:first-of-type { border-top: 0; }
    .phrase .ko { font-size: 17px; font-weight: 600; }
    .phrase .sub { font-size: 13.5px; color: var(--muted); }
    .phrase .status { font-size: 12.5px; margin-top: 4px; color: var(--muted); }
    .phrase .status.has { color: var(--walk); font-weight: 600; }
    .phrase .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
    .btn.rec { background: var(--danger); color: #fff; }
    .rec-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #fff; margin-right: 6px; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.25; } }

    .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--dark); color: #fff; padding: 12px 18px; border-radius: 18px; font-size: 14px; box-shadow: 0 10px 30px rgba(32, 44, 80, 0.2); z-index: 10; }
    .toast.error { background: var(--danger); }
    .center { text-align: center; padding: 40px 0; color: var(--text-2); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title">장소 관리</h1>
      <a href="index.html">사이트 보기 ›</a>
    </header>
    <main id="root"></main>
  </div>
  <div id="toast" class="toast" hidden></div>

  <!-- 지역 목록(DATA.areas)·문장 목록(DATA.phrases)을 쓰려고 불러와요. 장소·녹음 목록은 GitHub에서 최신본을 직접 읽어요. -->
  <script src="places.js"></script>
  <script src="data.js"></script>
  <script>
  (function () {
    /* ---------------- 설정 ---------------- */
    const REPO = 'dusohee/avery-rose-seoul';
    const BRANCH = 'main';
    const PLACES_PATH = 'places.js';
    const PHOTO_DIR = 'images/places';
    const PHOTO_MAX = 1200; // 업로드 사진 긴 변 최대 px
    const RAW = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/`;
    const TOKEN_KEY = 'seoul-admin-token';
    const VOICES_PATH = 'voices.js';
    const VOICE_DIR = 'audio/phrases';
    const VOICE_RATE = 22050; // 녹음 저장 샘플레이트 (WAV, 모노)
    const VOICE_MAX_SEC = 10; // 녹음 최대 길이

    const AREAS = window.DATA.areas;
    const PHRASES = (window.DATA.phrases || []).flatMap((g) => g.items.map((p) => ({ ...p, group: g.title.ko })));
    const KINDS = [
      { id: 'eat', label: '먹기', emoji: '🍜' },
      { id: 'see', label: '구경 · 쇼핑', emoji: '📷' },
      { id: 'walk', label: '걷기', emoji: '👟' },
    ];
    const KIND_LABEL = Object.fromEntries(KINDS.map((k) => [k.id, k.label]));
    const KIND_EMOJI = Object.fromEntries(KINDS.map((k) => [k.id, k.emoji]));

    const root = document.getElementById('root');
    const state = {
      token: localStorage.getItem(TOKEN_KEY) || '',
      places: null, // GitHub에서 읽어온 최신 목록
      sha: null,
      area: AREAS[0].id,
      editing: null, // { index: -1(새 장소) | n, draft, photoBlob, photoUrl }
      busy: false,
      loadError: null,
      tab: location.hash === '#voices' ? 'voices' : 'places',
      voices: null, // { 한글 문장: 파일 경로 }
      voicesSha: null,
      rec: null, // { ko, phase: 'recording' | 'review' | 'saving', recorder, stream, timer, blob, url }
    };

    /* ---------------- 도우미 ---------------- */
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const areaName = (id) => (AREAS.find((a) => a.id === id) || { name: { ko: id } }).name.ko;
    // 사이트 배포 전에도 보이도록 사진은 GitHub 원본 주소로 미리보기
    const photoSrc = (path) => (/^https?:/.test(path) ? path : RAW + path.split('/').map(encodeURIComponent).join('/'));

    let toastTimer;
    function toast(msg, isError) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast' + (isError ? ' error' : '');
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (el.hidden = true), isError ? 6000 : 3500);
    }

    function utf8ToB64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(bin);
    }
    function b64ToUtf8(b64) {
      const bin = atob(b64.replace(/\s/g, ''));
      return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
    }
    const blobToB64 = (blob) =>
      new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result).split(',')[1]);
        r.onerror = reject;
        r.readAsDataURL(blob);
      });

    /* ---------------- places.js 읽기/쓰기 형식 ---------------- */
    function parsePlaces(text) {
      const start = text.indexOf('[', text.indexOf('window.PLACES'));
      const end = text.lastIndexOf(']');
      const body = text.slice(start, end + 1).replace(/^\s*\/\/.*$/gm, '');
      return JSON.parse(body.replace(/,(\s*)\]$/, '$1]'));
    }

    const KEY_ORDER = ['area', 'kind', 'll', 'name', 'photo', 'note', 'query', 'naverUrl', 'googleUrl'];
    function serializePlaces(places) {
      const lines = [];
      const known = AREAS.map((a) => a.id);
      const groups = known.concat([...new Set(places.map((p) => p.area))].filter((id) => !known.includes(id)));
      for (const id of groups) {
        const list = places.filter((p) => p.area === id);
        if (!list.length) continue;
        lines.push(`  // ${areaName(id)}`);
        for (const p of list) {
          const o = {};
          for (const k of KEY_ORDER) if (p[k] !== undefined) o[k] = p[k];
          for (const k of Object.keys(p)) if (!(k in o)) o[k] = p[k];
          lines.push('  ' + JSON.stringify(o) + ',');
        }
      }
      return (
        `/* =========================================================\n` +
        ` * 소희의 추천 장소 — admin.html(관리자 페이지)이 자동으로 고치는 파일이에요.\n` +
        ` * 직접 고쳐도 되지만, 한 줄에 장소 하나(JSON) 형식은 지켜주세요.\n` +
        ` * kind: 'eat'(먹기) | 'see'(구경) | 'walk'(걷기)\n` +
        ` * ========================================================= */\n` +
        `window.PLACES = [\n` +
        lines.join('\n').replace(/,$/, '') +
        `\n];\n`
      );
    }

    /* ---------------- GitHub API ---------------- */
    async function gh(path, opts = {}) {
      const res = await fetch(`https://api.github.com/repos/${REPO}/${path}`, {
        ...opts,
        headers: {
          Accept: 'application/vnd.github+json',
          Authorization: `Bearer ${state.token}`,
          ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
        },
        cache: 'no-store',
      });
      if (!res.ok) {
        const err = new Error(`GitHub ${res.status}`);
        err.status = res.status;
        throw err;
      }
      return res.json();
    }

    function explain(err) {
      if (err.status === 401) return '토큰이 맞지 않거나 만료됐어요. 아래 "토큰 지우기" 후 다시 넣어주세요.';
      if (err.status === 403 || err.status === 404) return '토큰에 이 저장소 쓰기 권한(Contents: Read and write)이 없어요.';
      if (err.status === 409 || err.status === 422) return '다른 곳에서 먼저 바뀌었어요. 새로고침 후 다시 해주세요.';
      return '저장하지 못했어요. 인터넷 연결을 확인해주세요. (' + err.message + ')';
    }

    async function loadPlaces() {
      const file = await gh(`contents/${PLACES_PATH}?ref=${BRANCH}`);
      state.places = parsePlaces(b64ToUtf8(file.content));
      state.sha = file.sha;
    }

    async function savePlaces(places, message) {
      const res = await gh(`contents/${PLACES_PATH}`, {
        method: 'PUT',
        body: JSON.stringify({ message, content: utf8ToB64(serializePlaces(places)), sha: state.sha, branch: BRANCH }),
      });
      state.places = places;
      state.sha = res.content.sha;
    }

    async function uploadPhoto(blob, baseName) {
      const slug = (baseName || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'place';
      const path = `${PHOTO_DIR}/${slug}-${Date.now().toString(36)}.jpg`;
      await gh(`contents/${path}`, {
        method: 'PUT',
        body: JSON.stringify({ message: `사진 추가: ${path.split('/').pop()}`, content: await blobToB64(blob), branch: BRANCH }),
      });
      return path;
    }

    // 휴대폰 사진은 커서 긴 변 PHOTO_MAX px JPEG로 줄여서 올려요
    async function shrinkPhoto(file) {
      const url = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = () => reject(new Error('decode'));
          i.src = url;
        });
        const scale = Math.min(1, PHOTO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        return await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    /* ---------------- voices.js 읽기/쓰기 ---------------- */
    function parseVoices(text) {
      const start = text.indexOf('{', text.indexOf('window.VOICES'));
      const end = text.lastIndexOf('}');
      return JSON.parse(text.slice(start, end + 1).replace(/,(\s*)\}$/, '$1}'));
    }

    function serializeVoices(voices) {
      // data.js의 문장 순서대로, 그 밖의 것(문장이 바뀐 옛 녹음)은 뒤에
      const keys = PHRASES.map((p) => p.ko).filter((k) => voices[k]);
      for (const k of Object.keys(voices)) if (!keys.includes(k)) keys.push(k);
      return (
        `/* =========================================================\n` +
        ` * Simple Korean 녹음 — admin.html(관리자 페이지)이 자동으로 고치는 파일이에요.\n` +
        ` * "한글 문장": "녹음 파일 경로". 여기 없는 문장은 휴대폰 목소리가 읽어줘요.\n` +
        ` * data.js의 문장(ko)을 고치면 녹음이 연결되지 않으니 다시 녹음해주세요.\n` +
        ` * ========================================================= */\n` +
        `window.VOICES = {` +
        (keys.length ? '\n' + keys.map((k) => `  ${JSON.stringify(k)}: ${JSON.stringify(voices[k])}`).join(',\n') + '\n' : '') +
        `};\n`
      );
    }

    async function loadVoices() {
      try {
        const file = await gh(`contents/${VOICES_PATH}?ref=${BRANCH}`);
        state.voices = parseVoices(b64ToUtf8(file.content));
        state.voicesSha = file.sha;
      } catch (err) {
        if (err.status !== 404) throw err;
        state.voices = {}; // 아직 voices.js가 없으면 첫 저장 때 만들어요
        state.voicesSha = null;
      }
    }

    async function saveVoices(voices, message) {
      const res = await gh(`contents/${VOICES_PATH}`, {
        method: 'PUT',
        body: JSON.stringify({ message, content: utf8ToB64(serializeVoices(voices)), ...(state.voicesSha ? { sha: state.voicesSha } : {}), branch: BRANCH }),
      });
      state.voices = voices;
      state.voicesSha = res.content.sha;
    }

    async function uploadVoice(blob, rom) {
      const slug = (rom || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'phrase';
      const path = `${VOICE_DIR}/${slug}-${Date.now().toString(36)}.wav`;
      await gh(`contents/${path}`, {
        method: 'PUT',
        body: JSON.stringify({ message: `녹음 추가: ${path.split('/').pop()}`, content: await blobToB64(blob), branch: BRANCH }),
      });
      return path;
    }

    // 다시 녹음하거나 지울 때 옛 파일 정리 (실패해도 사이트에는 영향 없어서 조용히 넘어가요)
    async function deleteFile(path, message) {
      try {
        const file = await gh(`contents/${path}?ref=${BRANCH}`);
        await gh(`contents/${path}`, { method: 'DELETE', body: JSON.stringify({ message, sha: file.sha, branch: BRANCH }) });
      } catch (err) {
        console.warn('옛 녹음 파일을 지우지 못했어요', path, err);
      }
    }

    /* ---------------- 녹음 → WAV ----------------
     * 휴대폰마다 녹음 형식이 달라서(아이폰 mp4, 안드로이드 webm) 어디서나 재생되는 WAV로 바꿔 저장해요.
     * 앞뒤 무음은 잘라내고, 모노 22kHz라 한 문장에 100KB 안팎이에요. */
    async function toWav(blob) {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      let buf;
      try {
        const data = await blob.arrayBuffer();
        buf = await new Promise((resolve, reject) => ctx.decodeAudioData(data, resolve, reject));
      } finally {
        ctx.close && ctx.close();
      }

      // 모노로 섞기
      const n = buf.length;
      const mono = new Float32Array(n);
      for (let c = 0; c < buf.numberOfChannels; c++) {
        const ch = buf.getChannelData(c);
        for (let i = 0; i < n; i++) mono[i] += ch[i] / buf.numberOfChannels;
      }

      // 앞뒤 무음 자르기 (앞뒤 0.15초 여유)
      let peak = 0;
      for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(mono[i]));
      if (peak < 0.01) throw new Error('silent');
      const th = peak * 0.08;
      let a = 0, b = n - 1;
      while (a < n && Math.abs(mono[a]) < th) a++;
      while (b > a && Math.abs(mono[b]) < th) b--;
      const pad = Math.round(buf.sampleRate * 0.15);
      a = Math.max(0, a - pad);
      b = Math.min(n, b + pad);

      // 22kHz로 줄이기 + 소리 크기 맞추기
      const outLen = Math.max(1, Math.round(((b - a) * VOICE_RATE) / buf.sampleRate));
      const gain = Math.min(4, 0.9 / peak);
      const out = new Int16Array(outLen);
      const step = buf.sampleRate / VOICE_RATE;
      for (let i = 0; i < outLen; i++) {
        const pos = a + i * step;
        const j = Math.floor(pos), f = pos - j;
        const v = ((mono[j] || 0) * (1 - f) + (mono[j + 1] || 0) * f) * gain;
        out[i] = Math.max(-1, Math.min(1, v)) * 0x7fff;
      }

      const header = new DataView(new ArrayBuffer(44));
      const str = (o, s) => [...s].forEach((ch, k) => header.setUint8(o + k, ch.charCodeAt(0)));
      str(0, 'RIFF'); header.setUint32(4, 36 + out.byteLength, true); str(8, 'WAVE');
      str(12, 'fmt '); header.setUint32(16, 16, true); header.setUint16(20, 1, true); header.setUint16(22, 1, true);
      header.setUint32(24, VOICE_RATE, true); header.setUint32(28, VOICE_RATE * 2, true); header.setUint16(32, 2, true); header.setUint16(34, 16, true);
      str(36, 'data'); header.setUint32(40, out.byteLength, true);
      return new Blob([header, out], { type: 'audio/wav' });
    }

    let player = null;
    function play(src) {
      if (player) player.pause();
      player = new Audio(src);
      player.play().catch(() => toast('재생하지 못했어요.', true));
    }

    // 저장된 녹음 듣기: 사이트 배포 전에도 들리도록 GitHub에서 바로 받아와요
    async function playSaved(path) {
      try {
        const file = await gh(`contents/${path}?ref=${BRANCH}`);
        const bin = atob(file.content.replace(/\s/g, ''));
        play(URL.createObjectURL(new Blob([Uint8Array.from(bin, (c) => c.charCodeAt(0))], { type: 'audio/wav' })));
      } catch (err) {
        console.error(err);
        toast('녹음을 불러오지 못했어요.', true);
      }
    }

    async function startRecording(ko) {
      if (state.rec) {
        cancelRecording();
        render();
      }
      if (!navigator.mediaDevices || !window.MediaRecorder) return toast('이 브라우저에서는 녹음이 안 돼요. 대신 "파일 올리기"로 음성 메모를 올려주세요.', true);
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      } catch {
        return toast('마이크를 쓸 수 없어요. 브라우저 설정에서 마이크를 허용해주세요.', true);
      }
      const chunks = [];
      const recorder = new MediaRecorder(stream);
      const rec = { ko, phase: 'recording', recorder, stream };
      recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      recorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        clearTimeout(rec.timer);
        if (state.rec !== rec) return; // 취소됨
        await useAudio(new Blob(chunks, { type: recorder.mimeType }), ko);
      };
      rec.timer = setTimeout(() => recorder.state === 'recording' && recorder.stop(), VOICE_MAX_SEC * 1000);
      state.rec = rec;
      recorder.start();
      render();
    }

    // 녹음이나 올린 파일 → WAV로 바꿔서 "들어보고 저장" 단계로
    async function useAudio(blob, ko) {
      try {
        const wav = await toWav(blob);
        if (state.rec && state.rec.url) URL.revokeObjectURL(state.rec.url);
        state.rec = { ko, phase: 'review', blob: wav, url: URL.createObjectURL(wav) };
        render();
        play(state.rec.url);
      } catch (err) {
        console.error(err);
        state.rec = null;
        render();
        toast(err.message === 'silent' ? '소리가 거의 안 들어갔어요. 마이크 가까이에서 다시 해주세요.' : '이 소리 파일은 읽지 못했어요.', true);
      }
    }

    function cancelRecording() {
      const r = state.rec;
      if (!r) return;
      state.rec = null;
      if (r.recorder && r.recorder.state === 'recording') r.recorder.stop();
      if (r.url) URL.revokeObjectURL(r.url);
    }

    async function saveRecording() {
      const r = state.rec;
      if (!r || r.phase !== 'review' || state.busy) return;
      const phrase = PHRASES.find((p) => p.ko === r.ko) || {};
      const old = state.voices[r.ko];
      state.busy = true;
      r.phase = 'saving';
      render();
      try {
        const path = await uploadVoice(r.blob, phrase.rom);
        await saveVoices({ ...state.voices, [r.ko]: path }, `녹음 ${old ? '교체' : '추가'}: ${r.ko}`);
        if (old) await deleteFile(old, `옛 녹음 삭제: ${old.split('/').pop()}`);
        URL.revokeObjectURL(r.url);
        state.rec = null;
        toast('저장했어요! 1~2분 뒤 사이트에서 이 목소리로 나와요.');
      } catch (err) {
        console.error(err);
        r.phase = 'review';
        toast(explain(err), true);
      } finally {
        state.busy = false;
        render();
      }
    }

    async function removeVoice(ko) {
      const old = state.voices[ko];
      if (!old || state.busy || !confirm(`"${ko}" 녹음을 지울까요?\n지우면 휴대폰 목소리가 대신 읽어줘요.`)) return;
      state.busy = true;
      render();
      try {
        const next = { ...state.voices };
        delete next[ko];
        await saveVoices(next, `녹음 삭제: ${ko}`);
        await deleteFile(old, `녹음 파일 삭제: ${old.split('/').pop()}`);
        toast('지웠어요.');
      } catch (err) {
        console.error(err);
        toast(explain(err), true);
      } finally {
        state.busy = false;
        render();
      }
    }

        </section>

    // 폼 → draft (다시 그려도 입력이 안 날아가게)
    function readForm() {
      const f = document.getElementById('form');
      if (!f) return;
      const v = (n) => f.elements[n].value.trim();
      const d = state.editing.draft;
      d.area = v('area');
      d.kind = (f.querySelector('input[name=kind]:checked') || {}).value || 'eat';
      d.name = { ko: v('name_ko'), en: v('name_en') };
      d.note = { ko: v('note_ko'), en: v('note_en') };
      d.naverUrl = v('naverUrl');
      d.googleUrl = v('googleUrl');
      d.query = v('query');
      d.llText = v('ll');
    }

    function parseLL(text) {
      if (!text) return undefined;
      const nums = text.match(/-?\d+(?:\.\d+)?/g);
      if (!nums || nums.length < 2) return null;
      const lat = Number(nums[0]), lng = Number(nums[1]);
      if (lat < 33 || lat > 39 || lng < 124 || lng > 132) return null; // 한국 범위 밖이면 잘못 붙여넣은 것
      return [lat, lng];
    }

    async function submitForm() {
      readForm();
      const e = state.editing;
      const d = e.draft;
      if (!d.name.ko) return toast('한글 이름을 적어주세요.', true);
      const ll = parseLL(d.llText);
      if (ll === null) return toast('좌표 형식이 이상해요. 예: 37.57975, 126.97668', true);

      state.busy = true;
      render();
      try {
        let photo = d.photo;
        if (e.photoBlob) photo = await uploadPhoto(e.photoBlob, d.name.en);
        const place = { area: d.area, kind: d.kind, ll, name: d.name, photo: photo || undefined, note: d.note };
        if (d.query) place.query = d.query;
        if (d.naverUrl) place.naverUrl = d.naverUrl;
        if (d.googleUrl) place.googleUrl = d.googleUrl;
        // 폼에 없는 예전 필드는 그대로 유지
        for (const k of Object.keys(d.extra)) place[k] = d.extra[k];

        const next = state.places.slice();
        if (e.index < 0) next.push(place);
        else next[e.index] = place;
        await savePlaces(next, `${e.index < 0 ? '장소 추가' : '장소 수정'}: ${d.name.ko}`);
        state.area = d.area;
        state.editing = null;
        toast('저장했어요! 1~2분 뒤 사이트에 반영돼요.');
      } catch (err) {
        console.error(err);
        toast(err.message === 'decode' ? '사진을 읽지 못했어요.' : explain(err), true);
      } finally {
        state.busy = false;
        render();
      }
    }

    async function mutate(fn, message, okMsg) {
      if (state.busy) return;
      state.busy = true;
      try {
        const next = state.places.slice();
        fn(next);
        await savePlaces(next, message);
        if (okMsg) toast(okMsg);
      } catch (err) {
        console.error(err);
        toast(explain(err), true);
      } finally {
        state.busy = false;
        render();
      }
    }

    // 같은 동네 안에서 바로 위/아래 장소와 자리 바꾸기
    function move(i, dir) {
      const same = state.places.map((p, j) => j).filter((j) => state.places[j].area === state.places[i].area);
      const j = same[same.indexOf(i) + dir];
      if (j === undefined) return;
      mutate((list) => ([list[i], list[j]] = [list[j], list[i]]), `장소 순서 변경: ${areaName(state.places[i].area)}`);
    }

    function startEdit(index) {
      const p = index < 0 ? { area: state.area, kind: 'eat', name: {}, note: {} } : state.places[index];
      const { area, kind, ll, name, photo, note, query, naverUrl, googleUrl, ...extra } = p;
      state.editing = {
        index,
        draft: {
          area, kind, photo,
          name: { ko: name?.ko || '', en: name?.en || '' },
          note: { ko: note?.ko || '', en: note?.en || '' },
          ll, query: query || '', naverUrl: naverUrl || '', googleUrl: googleUrl || '', extra,
        },
        photoBlob: null,
        photoUrl: null,
      };
      render();
      window.scrollTo(0, 0);
    }

    function clearPendingPhoto() {
      if (state.editing.photoUrl) URL.revokeObjectURL(state.editing.photoUrl);
      state.editing.photoBlob = null;
      state.editing.photoUrl = null;
    }

    /* ---------------- 이벤트 ---------------- */
    root.addEventListener('click', (ev) => {
      const el = ev.target.closest('[data-action]');
      if (!el || el.disabled) return;
      const i = Number(el.dataset.i);
      switch (el.dataset.action) {
        case 'save-token': {
          const t = document.getElementById('token').value.trim();
          if (!t) return toast('토큰을 붙여넣어 주세요.', true);
          state.token = t;
          localStorage.setItem(TOKEN_KEY, t);
          start();
          break;
        }
        case 'logout':
          if (!confirm('이 브라우저에서 토큰을 지울까요?')) return;
          localStorage.removeItem(TOKEN_KEY);
          state.token = '';
          state.places = null;
          render();
          break;
        case 'retry':
          start();
          break;
        case 'area':
          state.area = el.dataset.id;
          render();
          break;
        case 'new':
          startEdit(-1);
          break;
        case 'edit':
          startEdit(i);
          break;
        case 'up':
          move(i, -1);
          break;
        case 'down':
          move(i, 1);
          break;
        case 'delete': {
          const name = state.places[i].name?.ko;
          if (!confirm(`"${name}"을(를) 삭제할까요?`)) return;
          mutate((list) => list.splice(i, 1), `장소 삭제: ${name}`, '삭제했어요.');
          break;
        }
        case 'remove-photo':
          readForm();
          clearPendingPhoto();
          state.editing.draft.photo = undefined;
          render();
          break;
        case 'tab':
          cancelRecording();
          state.tab = el.dataset.id;
          history.replaceState(null, '', state.tab === 'voices' ? '#voices' : location.pathname);
          render();
          window.scrollTo(0, 0);
          break;
        case 'rec-start':
          startRecording(el.dataset.ko);
          break;
        case 'rec-stop':
          if (state.rec && state.rec.recorder) state.rec.recorder.stop();
          break;
        case 'rec-cancel':
          cancelRecording();
          render();
          break;
        case 'rec-play':
          if (state.rec && state.rec.url) play(state.rec.url);
          break;
        case 'rec-save':
          saveRecording();
          break;
        case 'voice-play':
          playSaved(state.voices[el.dataset.ko]);
          break;
        case 'voice-delete':
          removeVoice(el.dataset.ko);
          break;
        case 'cancel':
          clearPendingPhoto();
          state.editing = null;
          render();
          break;
      }
    });

    root.addEventListener('change', async (ev) => {
      if (ev.target.name === 'voice' && ev.target.files[0]) {
        cancelRecording();
        return useAudio(ev.target.files[0], ev.target.dataset.ko);
      }
      if (ev.target.name !== 'photo' || !ev.target.files[0]) return;
      readForm();
      try {
        const blob = await shrinkPhoto(ev.target.files[0]);
        clearPendingPhoto();
        state.editing.photoBlob = blob;
        state.editing.photoUrl = URL.createObjectURL(blob);
      } catch {
        toast('이 사진은 읽지 못했어요. JPG나 PNG로 다시 골라주세요.', true);
      }
      render();
    });

    root.addEventListener('submit', (ev) => {
      ev.preventDefault();
      if (!state.busy) submitForm();
    });

    window.addEventListener('beforeunload', (ev) => {
      if (state.editing || state.busy || state.rec) ev.preventDefault();
    });

    async function start() {
      state.loadError = null;
      render();
      if (!state.token) return;
      try {
        await Promise.all([loadPlaces(), loadVoices()]);
      } catch (err) {
        console.error(err);
        state.loadError = explain(err);
      }
      render();
    }
    start();
  })();
  </script>
</body>
</html>
